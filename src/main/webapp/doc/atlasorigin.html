<body>
	<h3>ATLASの由来</h3>
	<div id="atlasorigin">
		ギリシア神話に<br> 登場する神（ティタン神族）。<br> 巨躯を持って知られ、<br>
		両腕と頭で天球（空）<br> を支えるとされる。<br> ティタン神族がゼウス達<br> との戦いに敗れると、<br>
		アトラスはゼウスによって、<br> 世界の西の果てで天空を<br> 背負うという役目を負わされる事となった。<br>
		ORBISの語源には、天球の意も含まれるので、<br> オルビスを支える情報系システムに、<br>
		という願いを込めて命名した。
	</div>
